services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 챗봇 로그와 배치 리포트를 포함한 공통 산출물 폴더를 마운트한다.
      - ./_OUTPUT/quality:/srv/app/_OUTPUT/quality
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/json/grafana_dashboard.json:ro
      - ./monitoring/k6_dashboard.json:/etc/grafana/provisioning/dashboards/json/k6_dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
